<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="bg-gray-800 text-white p-4">
        <h1 class="text-2xl">自己紹介カード</h1>
    </header>
    <main class="max-w-4xl mx-auto px-4">
        <h1 class="text-2xl font-bold text-gray-900 my-6 text-center">チームメンバー</h1>
        <div class="flex flex-wrap justify-center gap-6">
            <div class="bg-gray-100 rounded-lg shadow p-6 flex flex-col items-center">
                <span class="text-4xl">🙈</span>
                <h2 class="text-lg font-bold text-gray-900 mt-3">みざる</h2>
                <p class="text-gray-600 text-sm mt-2 text-center">悪いことを見ないよ!</p>
            </div>
            <div class="bg-gray-100 rounded-lg shadow p-6 flex flex-col items-center">
                <span class="text-4xl">🙉</span>
                <h2 class="text-lg font-bold text-gray-900 mt-3">きかざる</h2>
                <p class="text-gray-600 text-sm mt-2 text-center">悪いことを聞かないよ!</p>
            </div>
            <div class="bg-gray-100 rounded-lg shadow p-6 flex flex-col items-center">
                <span class="text-4xl">🙊</span>
                <h2 class="text-lg font-bold text-gray-900 mt-3">いわざる</h2>
                <p class="text-gray-600 text-sm mt-2 text-center">悪いことを言わないよ!</p>
            </div>
        </div>

    </main>
</body>
</html>
